<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROLOGUE · Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .activity-card .cat-tag {
    display: inline-block; font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--gold); margin-bottom: 0.8rem; font-weight: 600;
  }
  .activity-card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-primary); }
  .activity-card p { font-size: 0.92rem; color: var(--text-secondary); }
  .activity-icon { font-size: 1.6rem; margin-bottom: 0.6rem; display: block; }
</style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <section class="section" style="padding-top:5rem;">
    <div class="container">
      <div class="page-hero reveal">
  <span class="page-eyebrow">Explore</span>
  <h1 class="page-title">Our Activities</h1>
  <p class="page-desc">Sessions, workshops, performances and events hosted by PROLOGUE.</p>
</div>

<div class="filter-bar reveal" id="activityFilters" style="margin-left:auto;margin-right:auto;">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="reading">Reading</button>
  <button class="filter-btn" data-filter="writing">Writing</button>
  <button class="filter-btn" data-filter="performance">Performance</button>
  <button class="filter-btn" data-filter="creative">Creative</button>
</div>

      <div class="grid-3" id="activitiesGrid"></div>
    </div>
  </section>

<footer class="footer">
  <div class="container">

    <div class="footer-content">
      <div class="footer-brand">
        <h2>PROLOGUE</h2>
        <p>The Reading Club of LBSITW</p>
      </div>

      <div class="footer-line"></div>

      <p class="footer-quote">
        “A reader lives a thousand lives before he dies.”
      </p>

      <div class="footer-bottom">
        <span>📖 Read · Reflect · Reimagine</span>
        <span>© 2026 PROLOGUE · LBSITW</span>
      </div>
    </div>

  </div>
</footer>

  <script src="js/main.js"></script>
  <script src="js/activities.js"></script>
</body>
</html>
